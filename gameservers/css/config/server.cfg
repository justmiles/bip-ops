// Counter-Strike: Source server configuration (rendered by BipOps from CSS_* env vars).
// Loaded automatically at startup via "+servercfgfile server.cfg".

// Server display name on the server browser
hostname "{{getenv "CSS_HOSTNAME" "BipOps Counter-Strike: Source Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "CSS_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "CSS_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "CSS_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "CSS_CHEATS" "0"}}

// Alltalk: 1 lets both teams hear each other on voice.
sv_alltalk {{getenv "CSS_ALLTALK" "0"}}

// Server region hint for the master server browser (255 = world).
sv_region {{getenv "CSS_REGION" "255"}}

// Round / match rules
mp_timelimit {{getenv "CSS_TIMELIMIT" "30"}}
mp_maxrounds {{getenv "CSS_MAXROUNDS" "0"}}
mp_winlimit {{getenv "CSS_WINLIMIT" "0"}}
mp_roundtime {{getenv "CSS_ROUNDTIME" "5"}}
mp_freezetime {{getenv "CSS_FREEZETIME" "6"}}
mp_friendlyfire {{getenv "CSS_FRIENDLYFIRE" "0"}}
mp_autoteambalance {{getenv "CSS_AUTOTEAMBALANCE" "1"}}
mp_limitteams {{getenv "CSS_LIMITTEAMS" "2"}}
mp_startmoney {{getenv "CSS_STARTMONEY" "800"}}

// Friendly-fire on bots, buy anywhere and other defaults left to the game.

// Number of bots to add at startup (0 = none).
bot_quota {{getenv "CSS_BOT_QUOTA" "0"}}
bot_difficulty {{getenv "CSS_BOT_DIFFICULTY" "1"}}

// SourceTV broadcast settings (relay only enabled when CSS_TV_PORT is set).
tv_delay {{getenv "CSS_TV_DELAY" "30"}}
tv_name "{{getenv "CSS_TV_NAME" "BipOps SourceTV"}}"

// Download URL for fast custom-content downloads (blank = disabled).
sv_downloadurl "{{getenv "CSS_DOWNLOADURL" ""}}"
