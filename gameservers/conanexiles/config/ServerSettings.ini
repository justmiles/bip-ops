[ServerSettings]
ServerName={{getenv "CONANEXILES_SERVER_NAME" "BipOps Conan Exiles Server"}}
ServerPassword={{getenv "CONANEXILES_SERVER_PASSWORD" ""}}
AdminPassword={{getenv "CONANEXILES_ADMIN_PASSWORD" ""}}
MaxNudity={{getenv "CONANEXILES_MAX_NUDITY" "2"}}
PVPEnabled={{getenv "CONANEXILES_PVP_ENABLED" "True"}}
serverRegion={{getenv "CONANEXILES_SERVER_REGION" "0"}}
ServerCommunity={{getenv "CONANEXILES_SERVER_COMMUNITY" "0"}}
IsBattlEyeEnabled={{getenv "CONANEXILES_BATTLEYE_ENABLED" "False"}}
LogoutCharactersRemainInTheWorld={{getenv "CONANEXILES_LOGOUT_CHARACTERS_REMAIN" "False"}}
PlayerDamageMultiplier={{getenv "CONANEXILES_PLAYER_DAMAGE_MULTIPLIER" "1.000000"}}
NPCDamageMultiplier={{getenv "CONANEXILES_NPC_DAMAGE_MULTIPLIER" "1.000000"}}
PlayerXPRateMultiplier={{getenv "CONANEXILES_XP_RATE_MULTIPLIER" "1.000000"}}
HarvestAmountMultiplier={{getenv "CONANEXILES_HARVEST_AMOUNT_MULTIPLIER" "1.000000"}}
DayCycleSpeedScale={{getenv "CONANEXILES_DAY_CYCLE_SPEED" "1.000000"}}
NoOwnership={{getenv "CONANEXILES_NO_OWNERSHIP" "False"}}
EnablePurgeEvents={{getenv "CONANEXILES_ENABLE_PURGE" "True"}}
