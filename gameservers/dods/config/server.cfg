// Day of Defeat: Source server configuration (rendered by BipOps from DODS_* env vars).
// Executed at startup via "+exec server.cfg".

// Server display name on the server browser
hostname "{{getenv "DODS_HOSTNAME" "BipOps Day of Defeat: Source Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "DODS_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "DODS_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "DODS_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "DODS_CHEATS" "0"}}

// Message of the day region and server contact
sv_contact "{{getenv "DODS_CONTACT" ""}}"

// Round / match rules
mp_timelimit {{getenv "DODS_TIMELIMIT" "30"}}
mp_friendlyfire {{getenv "DODS_FRIENDLYFIRE" "0"}}
mp_allowspectators {{getenv "DODS_ALLOWSPECTATORS" "1"}}
mp_autoteambalance {{getenv "DODS_AUTOTEAMBALANCE" "1"}}
mp_limitteams {{getenv "DODS_LIMITTEAMS" "2"}}

// Download URL for custom maps/content (fast download redirect). Blank disables.
sv_downloadurl "{{getenv "DODS_DOWNLOADURL" ""}}"
sv_allowdownload {{getenv "DODS_ALLOWDOWNLOAD" "1"}}
sv_allowupload {{getenv "DODS_ALLOWUPLOAD" "1"}}

// Network rates
sv_minrate {{getenv "DODS_MINRATE" "0"}}
sv_maxrate {{getenv "DODS_MAXRATE" "0"}}
