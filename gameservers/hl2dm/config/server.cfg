// Half-Life 2: Deathmatch server configuration (rendered by BipOps from HL2DM_* env vars).
// Loaded automatically at startup via "+servercfgfile server.cfg".

// Server display name on the server browser
hostname "{{getenv "HL2DM_HOSTNAME" "BipOps Half-Life 2: Deathmatch Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "HL2DM_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "HL2DM_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "HL2DM_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "HL2DM_CHEATS" "0"}}

// Alltalk: 1 lets all players hear each other on voice regardless of team.
sv_alltalk {{getenv "HL2DM_ALLTALK" "0"}}

// Server region hint for the master server browser (255 = world).
sv_region {{getenv "HL2DM_REGION" "255"}}

// Match rules
mp_timelimit {{getenv "HL2DM_TIMELIMIT" "0"}}
mp_fraglimit {{getenv "HL2DM_FRAGLIMIT" "0"}}
mp_teamplay {{getenv "HL2DM_TEAMPLAY" "0"}}
mp_friendlyfire {{getenv "HL2DM_FRIENDLYFIRE" "0"}}
mp_falldamage {{getenv "HL2DM_FALLDAMAGE" "0"}}
mp_flashlight {{getenv "HL2DM_FLASHLIGHT" "1"}}
mp_footsteps {{getenv "HL2DM_FOOTSTEPS" "1"}}
mp_forcerespawn {{getenv "HL2DM_FORCERESPAWN" "1"}}
mp_weaponstay {{getenv "HL2DM_WEAPONSTAY" "0"}}

// Allow the gravity gun to pick up and punt almost anything (1 = classic HL2DM mayhem).
physcannon_mega_enabled {{getenv "HL2DM_MEGA_PHYSCANNON" "0"}}

// Download URL for fast custom-content downloads (blank = disabled).
sv_downloadurl "{{getenv "HL2DM_DOWNLOADURL" ""}}"

// SourceTV broadcast settings (relay only enabled when HL2DM_TV_PORT is set).
tv_delay {{getenv "HL2DM_TV_DELAY" "30"}}
tv_name "{{getenv "HL2DM_TV_NAME" "BipOps SourceTV"}}"
