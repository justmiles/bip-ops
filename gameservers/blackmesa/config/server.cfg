// Black Mesa Deathmatch server configuration (rendered by BipOps from BLACKMESA_* env vars).
// Executed at map load via "+exec server.cfg".

// Server display name on the server browser
hostname "{{getenv "BLACKMESA_HOSTNAME" "BipOps Black Mesa Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "BLACKMESA_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "BLACKMESA_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "BLACKMESA_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "BLACKMESA_CHEATS" "0"}}

// Round / match rules
mp_timelimit {{getenv "BLACKMESA_TIMELIMIT" "20"}}
mp_fraglimit {{getenv "BLACKMESA_FRAGLIMIT" "0"}}
mp_friendlyfire {{getenv "BLACKMESA_FRIENDLYFIRE" "0"}}
mp_falldamage {{getenv "BLACKMESA_FALLDAMAGE" "1"}}
mp_flashlight {{getenv "BLACKMESA_FLASHLIGHT" "1"}}
mp_footsteps {{getenv "BLACKMESA_FOOTSTEPS" "1"}}

// Downloaded-content URL for custom maps/models (blank = disabled).
sv_downloadurl "{{getenv "BLACKMESA_DOWNLOADURL" ""}}"
