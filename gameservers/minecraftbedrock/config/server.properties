# Minecraft Bedrock Server Properties
# Managed by BipOps - do not edit manually

# Server identity
server-name={{getenv "MINECRAFTBEDROCK_SERVER_NAME" "A BipOps Bedrock Server"}}

# Gameplay
gamemode={{getenv "MINECRAFTBEDROCK_GAMEMODE" "survival"}}
force-gamemode={{getenv "MINECRAFTBEDROCK_FORCE_GAMEMODE" "false"}}
difficulty={{getenv "MINECRAFTBEDROCK_DIFFICULTY" "easy"}}
allow-cheats={{getenv "MINECRAFTBEDROCK_ALLOW_CHEATS" "false"}}

# Networking
server-port={{getenv "MINECRAFTBEDROCK_SERVER_PORT" "19132"}}
server-portv6={{getenv "MINECRAFTBEDROCK_SERVER_PORT_V6" "19133"}}
enable-lan-visibility={{getenv "MINECRAFTBEDROCK_LAN_VISIBILITY" "true"}}
compression-algorithm={{getenv "MINECRAFTBEDROCK_COMPRESSION_ALGORITHM" "zlib"}}
compression-threshold={{getenv "MINECRAFTBEDROCK_COMPRESSION_THRESHOLD" "1"}}

# Players
max-players={{getenv "MINECRAFTBEDROCK_MAX_PLAYERS" "10"}}
online-mode={{getenv "MINECRAFTBEDROCK_ONLINE_MODE" "true"}}
allow-list={{getenv "MINECRAFTBEDROCK_ALLOW_LIST" "false"}}
allow-player-joining={{getenv "MINECRAFTBEDROCK_ALLOW_PLAYER_JOINING" "true"}}
player-idle-timeout={{getenv "MINECRAFTBEDROCK_PLAYER_IDLE_TIMEOUT" "30"}}
default-player-permission-level={{getenv "MINECRAFTBEDROCK_DEFAULT_PERMISSION" "member"}}
chat-restriction={{getenv "MINECRAFTBEDROCK_CHAT_RESTRICTION" "None"}}
disable-player-interaction={{getenv "MINECRAFTBEDROCK_DISABLE_PLAYER_INTERACTION" "false"}}
disable-custom-skins={{getenv "MINECRAFTBEDROCK_DISABLE_CUSTOM_SKINS" "false"}}
disable-persona={{getenv "MINECRAFTBEDROCK_DISABLE_PERSONA" "false"}}

# World
level-name={{getenv "MINECRAFTBEDROCK_LEVEL_NAME" "Bedrock level"}}
level-seed={{getenv "MINECRAFTBEDROCK_LEVEL_SEED" ""}}
view-distance={{getenv "MINECRAFTBEDROCK_VIEW_DISTANCE" "32"}}
tick-distance={{getenv "MINECRAFTBEDROCK_TICK_DISTANCE" "4"}}
texturepack-required={{getenv "MINECRAFTBEDROCK_TEXTUREPACK_REQUIRED" "false"}}
client-side-chunk-generation-enabled={{getenv "MINECRAFTBEDROCK_CLIENT_CHUNK_GEN" "true"}}

# Performance
max-threads={{getenv "MINECRAFTBEDROCK_MAX_THREADS" "8"}}
server-build-radius-ratio={{getenv "MINECRAFTBEDROCK_BUILD_RADIUS_RATIO" "Disabled"}}
block-network-ids-are-hashes={{getenv "MINECRAFTBEDROCK_BLOCK_NETWORK_IDS_HASHES" "true"}}

# Client graphics
disable-client-vibrant-visuals={{getenv "MINECRAFTBEDROCK_DISABLE_VIBRANT_VISUALS" "true"}}

# Server-authoritative movement and interactions
server-authoritative-movement-strict={{getenv "MINECRAFTBEDROCK_MOVEMENT_MODE" "server-auth"}}
player-position-acceptance-threshold={{getenv "MINECRAFTBEDROCK_POSITION_THRESHOLD" "0.5"}}
player-movement-action-direction-threshold={{getenv "MINECRAFTBEDROCK_MOVEMENT_DIRECTION_THRESHOLD" "0.85"}}
server-authoritative-block-breaking-pick-range-scalar={{getenv "MINECRAFTBEDROCK_AUTH_BLOCK_BREAKING" "false"}}
server-authoritative-dismount-strict={{getenv "MINECRAFTBEDROCK_AUTH_DISMOUNT_STRICT" "false"}}
server-authoritative-entity-interactions-strict={{getenv "MINECRAFTBEDROCK_AUTH_ENTITY_INTERACTIONS" "false"}}

# Content logging
content-log-file-enabled={{getenv "MINECRAFTBEDROCK_CONTENT_LOG_FILE" "false"}}
content-log-level={{getenv "MINECRAFTBEDROCK_CONTENT_LOG_LEVEL" "info"}}

# Script watchdog (relevant when running behavior packs/addons)
script-watchdog-enable={{getenv "MINECRAFTBEDROCK_WATCHDOG_ENABLE" "true"}}
script-watchdog-enable-exception-handling={{getenv "MINECRAFTBEDROCK_WATCHDOG_EXCEPTIONS" "true"}}
script-watchdog-enable-shutdown={{getenv "MINECRAFTBEDROCK_WATCHDOG_SHUTDOWN" "true"}}
script-watchdog-hang-exception={{getenv "MINECRAFTBEDROCK_WATCHDOG_HANG_EXCEPTION" "true"}}
script-watchdog-hang-threshold={{getenv "MINECRAFTBEDROCK_WATCHDOG_HANG_THRESHOLD" "10000"}}
script-watchdog-spike-threshold={{getenv "MINECRAFTBEDROCK_WATCHDOG_SPIKE_THRESHOLD" "100"}}
script-watchdog-slow-threshold={{getenv "MINECRAFTBEDROCK_WATCHDOG_SLOW_THRESHOLD" "10"}}
script-watchdog-memory-limit={{getenv "MINECRAFTBEDROCK_WATCHDOG_MEMORY_LIMIT" "250"}}
script-watchdog-memory-warning={{getenv "MINECRAFTBEDROCK_WATCHDOG_MEMORY_WARNING" "100"}}
