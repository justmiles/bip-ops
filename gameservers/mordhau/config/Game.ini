[/Script/Mordhau.MordhauGameSession]
ServerName={{getenv "MORDHAU_SERVER_NAME" "BipOps Mordhau Server"}}
ServerPassword={{getenv "MORDHAU_SERVER_PASSWORD" ""}}
AdminPassword={{getenv "MORDHAU_ADMIN_PASSWORD" ""}}
MaxSlots={{getenv "MORDHAU_MAX_SLOTS" "16"}}
MOTD={{getenv "MORDHAU_MOTD" "Welcome to a BipOps Mordhau Server!"}}
BannerURL={{getenv "MORDHAU_BANNER_URL" ""}}
{{- if getenv "MORDHAU_ADMINS" }}
{{ range (getenv "MORDHAU_ADMINS" | strings.Split ",") -}}
Admins={{ . }}
{{ end -}}
{{- end }}

[/Script/Mordhau.MordhauGameMode]
PlayerRespawnTime={{getenv "MORDHAU_PLAYER_RESPAWN_TIME" "5.000000"}}
TeamDamageFactor={{getenv "MORDHAU_TEAM_DAMAGE_FACTOR" "0.500000"}}
bEnableVoteKicks={{getenv "MORDHAU_ENABLE_VOTE_KICKS" "True"}}
bAllowDuels={{getenv "MORDHAU_ALLOW_DUELS" "True"}}
MatchLengthFactor={{getenv "MORDHAU_MATCH_LENGTH_FACTOR" "1.000000"}}
{{ range (getenv "MORDHAU_MAP_ROTATION" "FFA_ThePit,FFA_Grad,FFA_Camp,FFA_Mountainpeak,FFA_Contraband" | strings.Split ",") -}}
MapRotation={{ . }}
{{ end -}}
