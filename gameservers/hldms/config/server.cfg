// Half-Life Deathmatch: Source server configuration
// (rendered by BipOps from HLDMS_* env vars).
// Executed automatically at map load via "+exec server.cfg".

// Server display name on the server browser
hostname "{{getenv "HLDMS_HOSTNAME" "BipOps Half-Life Deathmatch Source Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "HLDMS_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "HLDMS_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "HLDMS_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "HLDMS_CHEATS" "0"}}

// Server region for the master server list.
// 0=US East 1=US West 2=South America 3=Europe 4=Asia 5=Australia 6=Middle East 7=Africa 255=World
sv_region {{getenv "HLDMS_REGION" "255"}}

// Match rules
mp_timelimit {{getenv "HLDMS_TIMELIMIT" "0"}}
mp_fraglimit {{getenv "HLDMS_FRAGLIMIT" "0"}}
mp_friendlyfire {{getenv "HLDMS_FRIENDLYFIRE" "0"}}
mp_falldamage {{getenv "HLDMS_FALLDAMAGE" "0"}}
mp_flashlight {{getenv "HLDMS_FLASHLIGHT" "1"}}
mp_footsteps {{getenv "HLDMS_FOOTSTEPS" "1"}}
mp_forcerespawn {{getenv "HLDMS_FORCERESPAWN" "1"}}
mp_weaponstay {{getenv "HLDMS_WEAPONSTAY" "0"}}

// Server tick / network bandwidth
sv_maxrate {{getenv "HLDMS_MAXRATE" "0"}}
sv_minrate {{getenv "HLDMS_MINRATE" "0"}}

// SourceTV broadcast settings (relay only enabled when HLDMS_TV_PORT is set).
tv_delay {{getenv "HLDMS_TV_DELAY" "30"}}
tv_name "{{getenv "HLDMS_TV_NAME" "BipOps SourceTV"}}"
