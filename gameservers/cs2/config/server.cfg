// Counter-Strike 2 server configuration (rendered by BipOps from CS2_* env vars).
// Executed automatically at map load via "+exec server.cfg".

// Server display name on the server browser
hostname "{{getenv "CS2_HOSTNAME" "BipOps Counter-Strike 2 Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "CS2_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "CS2_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "CS2_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "CS2_CHEATS" "0"}}

// Keep simulating the world while empty. 0 lets the server hibernate to save CPU.
sv_hibernate_when_empty {{getenv "CS2_HIBERNATE_WHEN_EMPTY" "1"}}

// Round / match rules
mp_autoteambalance {{getenv "CS2_AUTOTEAMBALANCE" "1"}}
mp_limitteams {{getenv "CS2_LIMITTEAMS" "2"}}
mp_maxrounds {{getenv "CS2_MAXROUNDS" "24"}}
mp_friendlyfire {{getenv "CS2_FRIENDLYFIRE" "1"}}
mp_roundtime {{getenv "CS2_ROUNDTIME" "1.92"}}
mp_freezetime {{getenv "CS2_FREEZETIME" "15"}}

// Number of bots to fill the server with (0 = none).
bot_quota {{getenv "CS2_BOT_QUOTA" "0"}}

// GOTV broadcast settings (relay only enabled when CS2_TV_PORT is set).
tv_delay {{getenv "CS2_TV_DELAY" "30"}}
tv_name "{{getenv "CS2_TV_NAME" "BipOps GOTV"}}"
