game: Counter-Strike 2
usewine: false
usex: false
steamid: 730
backupdir: /game/game/csgo/cfg
configs:
  "config/server.cfg": "/game/game/csgo/cfg/server.cfg"
metrics:
  # CS2 is a Source-engine (SRCDS) server: it answers Steam A2S_INFO queries on
  # the same UDP port as game traffic (README "Required Ports": 27015/UDP =
  # "Game traffic and Steam A2S query"). That port is set by CS2_PORT in
  # start.sh (-port "${CS2_PORT:-27015}"), so query the game port directly.
  strategy: a2s
  interval: 30s
  a2s:
    query_port_env: CS2_PORT
