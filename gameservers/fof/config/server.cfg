// Fistful of Frags server configuration (rendered by BipOps from FOF_* env vars).
// Lives at fof/cfg/server.cfg and is executed at map load via "+exec server.cfg".

// Server display name on the server browser
hostname "{{getenv "FOF_HOSTNAME" "BipOps Fistful of Frags Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "FOF_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "FOF_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "FOF_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "FOF_CHEATS" "0"}}

// Match rules
mp_timelimit {{getenv "FOF_TIMELIMIT" "25"}}
mp_fraglimit {{getenv "FOF_FRAGLIMIT" "0"}}
mp_friendlyfire {{getenv "FOF_FRIENDLYFIRE" "0"}}

// Voice / text chat
sv_voiceenable {{getenv "FOF_VOICE_ENABLE" "1"}}
sv_alltalk {{getenv "FOF_ALLTALK" "0"}}

// Bots backfill a percentage of empty player slots (0 = no bots).
fof_sv_bot_slotpct {{getenv "FOF_BOT_SLOTPCT" "0"}}

// Steam master-server region (255 = world). See valve sv_region list.
sv_region {{getenv "FOF_REGION" "255"}}
