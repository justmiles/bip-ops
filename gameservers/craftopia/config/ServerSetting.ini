[GameWorld]
name={{getenv "CRAFTOPIA_SERVER_NAME" "BipOps Craftopia Server"}}
difficulty={{getenv "CRAFTOPIA_DIFFICULTY" "1"}}
gameMode={{getenv "CRAFTOPIA_GAME_MODE" "1"}}

[Host]
isUseSteamLobby={{getenv "CRAFTOPIA_USE_STEAM_LOBBY" "1"}}
port={{getenv "CRAFTOPIA_PORT" "6587"}}
maxPlayerNumber={{getenv "CRAFTOPIA_MAX_PLAYERS" "7"}}
usePassword={{getenv "CRAFTOPIA_USE_PASSWORD" "0"}}
serverPassword={{getenv "CRAFTOPIA_SERVER_PASSWORD" "00000000"}}
bindAddress={{getenv "CRAFTOPIA_BIND_ADDRESS" "0.0.0.0"}}

[Graphics]
vSyncCount=0
maxFPS={{getenv "CRAFTOPIA_MAX_FPS" "60"}}
grassBend=0
clothSimOption=2

[Save]
autoSaveSec={{getenv "CRAFTOPIA_AUTOSAVE_SEC" "300"}}
autoSavePerHour={{getenv "CRAFTOPIA_AUTOSAVE_PER_HOUR" "1"}}
savePath=/game/DedicatedServerSave/

[CreativeModeSetting]
quickCraft={{getenv "CRAFTOPIA_QUICK_CRAFT" "1"}}
ageLevel={{getenv "CRAFTOPIA_AGE_LEVEL" "7"}}
islandLevel={{getenv "CRAFTOPIA_ISLAND_LEVEL" "-1"}}
noDeath={{getenv "CRAFTOPIA_NO_DEATH" "1"}}
noDamage={{getenv "CRAFTOPIA_NO_DAMAGE" "1"}}
noHunger={{getenv "CRAFTOPIA_NO_HUNGER" "1"}}
infinitStamina={{getenv "CRAFTOPIA_INFINITE_STAMINA" "1"}}
forceDayTime={{getenv "CRAFTOPIA_FORCE_DAYTIME" "-1"}}
buildingIgnoreDamage={{getenv "CRAFTOPIA_BUILDING_IGNORE_DAMAGE" "0"}}
noBuild={{getenv "CRAFTOPIA_NO_BUILD" "0"}}

[CreativeModePlStatus]
Level=0
Health=0
Mana=0
Stamina=0
Money={{getenv "CRAFTOPIA_START_MONEY" "1000"}}
SkillPoint=0
EnchantPoint=0
