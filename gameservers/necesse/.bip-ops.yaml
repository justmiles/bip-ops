game: Necesse
usewine: false
usex: false
steamid: 1169370
backupdir: /home/bipops/.config/Necesse/saves
configs:
  "config/server.cfg": "/home/bipops/.config/Necesse/cfg/server.cfg"
metrics:
  strategy: logregex
  interval: 30s
  logregex:
    # Necesse has no RCON and does not answer Steam A2S queries (verified), so track
    # players from the server log (stdout -> /var/log/gameserver/current). Verified
    # against live server logs (1.3.3); both patterns capture the Steam ID so the
    # join/leave set stays balanced:
    #   join:  Client "76561198813665297" connected on slot 1/4
    #   leave: Player 76561198813665297 ("justMiles2") disconnected with message: Quit
    join_pattern: 'Client "([0-9]+)" connected on slot'
    leave_pattern: 'Player ([0-9]+) \('
  ready:
    log_pattern: 'Started server using port'
