// Rust server configuration (rendered by BipOps from RUST_* env vars).
// Rust auto-executes server/<identity>/cfg/server.cfg at startup.
// Networking, world generation, and RCON convars are set on the command line
// in start.sh; this file holds the runtime gameplay/presentation convars.

server.hostname "{{getenv "RUST_SERVER_NAME" "BipOps Rust Server"}}"
server.description "{{getenv "RUST_SERVER_DESCRIPTION" "A Rust server hosted with BipOps"}}"
server.url "{{getenv "RUST_SERVER_URL" ""}}"
server.headerimage "{{getenv "RUST_SERVER_HEADER_IMAGE" ""}}"

// Space-separated tags advertised to the server browser (e.g. "monthly vanilla").
server.tags "{{getenv "RUST_SERVER_TAGS" "monthly vanilla"}}"

// Seconds between automatic world saves.
server.saveinterval {{getenv "RUST_SAVE_INTERVAL" "600"}}

// PvE mode. false = PvP (default), true = players cannot damage each other.
server.pve {{getenv "RUST_PVE" "false"}}
