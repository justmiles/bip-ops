// Team Fortress 2 server configuration (rendered by BipOps from TF2_* env vars).
// Loaded automatically at startup via "+servercfgfile server.cfg".

// Server display name on the server browser
hostname "{{getenv "TF2_HOSTNAME" "BipOps Team Fortress 2 Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "TF2_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "TF2_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "TF2_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "TF2_CHEATS" "0"}}

// Alltalk: 1 lets both teams hear each other on voice.
sv_alltalk {{getenv "TF2_ALLTALK" "0"}}

// Server region hint for the master server browser (255 = world).
sv_region {{getenv "TF2_REGION" "255"}}

// Round / match rules
mp_timelimit {{getenv "TF2_TIMELIMIT" "30"}}
mp_winlimit {{getenv "TF2_WINLIMIT" "0"}}
mp_maxrounds {{getenv "TF2_MAXROUNDS" "0"}}
mp_friendlyfire {{getenv "TF2_FRIENDLYFIRE" "0"}}
mp_autoteambalance {{getenv "TF2_AUTOTEAMBALANCE" "1"}}
mp_teams_unbalance_limit {{getenv "TF2_TEAMS_UNBALANCE_LIMIT" "1"}}

// Respawn time scaling (0 = default times, lower = faster respawns).
mp_respawnwavetime {{getenv "TF2_RESPAWNWAVETIME" "10"}}

// SourceTV broadcast settings (relay only enabled when TF2_TV_PORT is set).
tv_delay {{getenv "TF2_TV_DELAY" "30"}}
tv_name "{{getenv "TF2_TV_NAME" "BipOps SourceTV"}}"

// Download URL for fast custom-content downloads (blank = disabled).
sv_downloadurl "{{getenv "TF2_DOWNLOADURL" ""}}"
