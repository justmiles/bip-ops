// Garry's Mod server configuration (rendered by BipOps from GARRYSMOD_* env vars).
// Loaded automatically at startup via "+servercfgfile server.cfg".

// Server display name on the server browser
hostname "{{getenv "GARRYSMOD_HOSTNAME" "BipOps Garry's Mod Server"}}"

// RCON administration password. Blank disables remote console.
rcon_password "{{getenv "GARRYSMOD_RCON_PASSWORD" ""}}"

// Password required to join. Blank means public (no password).
sv_password "{{getenv "GARRYSMOD_PASSWORD" ""}}"

// Restrict to LAN only. 0 = internet-reachable, 1 = LAN only.
sv_lan {{getenv "GARRYSMOD_LAN" "0"}}

// Allow cheat commands. 0 = off (recommended), 1 = on.
sv_cheats {{getenv "GARRYSMOD_CHEATS" "0"}}

// Server region hint for the master server browser (255 = world).
sv_region {{getenv "GARRYSMOD_REGION" "255"}}

// Let players spawn props / use the physics gun / toolgun (sandbox).
sbox_maxprops {{getenv "GARRYSMOD_MAX_PROPS" "150"}}
sbox_maxragdolls {{getenv "GARRYSMOD_MAX_RAGDOLLS" "15"}}
sbox_noclip {{getenv "GARRYSMOD_NOCLIP" "1"}}
sbox_godmode {{getenv "GARRYSMOD_GODMODE" "0"}}

// Allow clients to download custom content from the server.
sv_allowdownload {{getenv "GARRYSMOD_ALLOWDOWNLOAD" "1"}}
sv_allowupload {{getenv "GARRYSMOD_ALLOWUPLOAD" "1"}}

// Download URL for fast custom-content downloads (blank = disabled).
sv_downloadurl "{{getenv "GARRYSMOD_DOWNLOADURL" ""}}"

// Voice chat enabled (1) or disabled (0).
sv_voiceenable {{getenv "GARRYSMOD_VOICE_ENABLE" "1"}}

// Network tick rates (defaults are fine for most servers).
sv_minrate {{getenv "GARRYSMOD_MINRATE" "0"}}
sv_maxrate {{getenv "GARRYSMOD_MAXRATE" "0"}}
